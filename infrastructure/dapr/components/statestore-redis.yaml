apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
  namespace: default
spec:
  type: state.redis
  version: v1
  metadata:
  # Redis host address
  - name: redisHost
    value: "redis-master.infrastructure.svc.cluster.local:6379"

  # Redis password (empty for local development)
  - name: redisPassword
    value: ""

  # For production with password:
  # - name: redisPassword
  #   secretKeyRef:
  #     name: redis-secrets
  #     key: password

  # Enable TLS for production
  - name: enableTLS
    value: "false"

  # Retry configuration
  - name: maxRetries
    value: "3"

  - name: maxRetryBackoff
    value: "2s"

  # Connection pool settings
  - name: maxConnAge
    value: "30m"

  # TTL for state entries (optional, 0 = no expiration)
  - name: ttlInSeconds
    value: "0"

  # Key prefix for namespacing
  - name: keyPrefix
    value: "todo-platform"
