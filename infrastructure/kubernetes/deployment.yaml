apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-chatbot-deployment
  labels:
    app: todo-chatbot
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-chatbot
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: todo-chatbot
        version: v1
    spec:
      containers:
      - name: todo-chatbot
        image: todo-chatbot:latest
        imagePullPolicy: Never
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/ready
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 2
        envFrom:
        - configMapRef:
            name: todo-chatbot-config
        - secretRef:
            name: todo-chatbot-secrets
