apiVersion: v1
kind: Service
metadata:
  name: sync-service
  namespace: todo-platform
  labels:
    app: sync-service
spec:
  type: ClusterIP
  selector:
    app: sync-service
  ports:
  - name: http
    port: 3005
    targetPort: 3005
    protocol: TCP
  - name: websocket
    port: 3006
    targetPort: 3006
    protocol: TCP
