# Event Schemas (CloudEvents Format)

**Feature**: Event-Driven Todo Chatbot Platform
**Date**: 2026-01-19
**Format**: CloudEvents 1.0
**Content Type**: application/json

## Overview

This document defines all event schemas used in the event-driven architecture. All events follow the CloudEvents 1.0 specification and are published to Kafka topics via Dapr pub/sub.

---

## Kafka Topics

| Topic | Purpose | Partition Key | Retention |
|-------|---------|---------------|-----------|
| `task-events` | Task lifecycle events (created, updated, completed, deleted) | userId | 7 days |
| `reminders` | Reminder scheduling and delivery events | userId | 7 days |
| `task-updates` | Real-time sync events for WebSocket broadcast | userId | 1 day |

---

## CloudEvents Envelope

All events use the CloudEvents 1.0 specification:

```json
{
  "specversion": "1.0",
  "type": "com.todo.<aggregate>.<action>",
  "source": "<service-name>",
  "id": "<uuid>",
  "time": "<ISO 8601 timestamp>",
  "datacontenttype": "application/json",
  "data": { ... }
}
```

**Required Fields**:
- `specversion`: Always "1.0"
- `type`: Event type in format `com.todo.<aggregate>.<action>`
- `source`: Service that published the event
- `id`: Unique event ID (UUID v4)
- `time`: Event timestamp (ISO 8601 format)
- `datacontenttype`: Always "application/json"
- `data`: Event payload (schema defined below)

**Optional Fields**:
- `subject`: Resource identifier (e.g., taskId)
- `correlationid`: Correlation ID for distributed tracing (custom extension)

---

## Event Schemas

### 1. TaskCreated

**Type**: `com.todo.task.created`
**Topic**: `task-events`
**Source**: `task-service`
**Description**: Published when a new task is created

**Data Schema**:
```json
{
  "taskId": "uuid",
  "userId": "string",
  "title": "string",
  "description": "string | null",
  "priority": "low | medium | high",
  "tags": ["string"],
  "dueDate": "ISO 8601 timestamp | null",
  "recurrencePattern": "none | daily | weekly | monthly",
  "isCompleted": false,
  "createdAt": "ISO 8601 timestamp"
}
```

**Example**:
```json
{
  "specversion": "1.0",
  "type": "com.todo.task.created",
  "source": "task-service",
  "id": "a1b2c3d4-e5f6-7890-abcd-ef1234567890",
  "time": "2026-01-19T10:30:00Z",
  "subject": "task/123e4567-e89b-12d3-a456-426614174000",
  "datacontenttype": "application/json",
  "correlationid": "req-abc123",
  "data": {
    "taskId": "123e4567-e89b-12d3-a456-426614174000",
    "userId": "user-001",
    "title": "Buy groceries",
    "description": "Milk, eggs, bread",
    "priority": "medium",
    "tags": ["shopping", "personal"],
    "dueDate": "2026-01-20T14:00:00Z",
    "recurrencePattern": "none",
    "isCompleted": false,
    "createdAt": "2026-01-19T10:30:00Z"
  }
}
```

**Consumers**:
- Notification Service (schedules reminder if dueDate is set)
- Audit Service (logs creation)
- Sync Service (broadcasts to connected clients)

