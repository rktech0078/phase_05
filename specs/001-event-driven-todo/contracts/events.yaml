### 2. TaskUpdated

**Type**: `com.todo.task.updated`
**Topic**: `task-events`
**Source**: `task-service`
**Description**: Published when a task is updated

**Data Schema**:
```json
{
  "taskId": "uuid",
  "userId": "string",
  "changes": {
    "title": { "old": "string", "new": "string" },
    "description": { "old": "string | null", "new": "string | null" },
    "priority": { "old": "low | medium | high", "new": "low | medium | high" },
    "tags": { "old": ["string"], "new": ["string"] },
    "dueDate": { "old": "ISO 8601 | null", "new": "ISO 8601 | null" },
    "recurrencePattern": { "old": "none | daily | weekly | monthly", "new": "none | daily | weekly | monthly" }
  },
  "updatedAt": "ISO 8601 timestamp"
}
```

**Example**:
```json
{
  "specversion": "1.0",
  "type": "com.todo.task.updated",
  "source": "task-service",
  "id": "b2c3d4e5-f6a7-8901-bcde-f12345678901",
  "time": "2026-01-19T11:00:00Z",
  "subject": "task/123e4567-e89b-12d3-a456-426614174000",
  "datacontenttype": "application/json",
  "correlationid": "req-def456",
  "data": {
    "taskId": "123e4567-e89b-12d3-a456-426614174000",
    "userId": "user-001",
    "changes": {
      "title": {
        "old": "Buy groceries",
        "new": "Buy groceries and cook dinner"
      },
      "priority": {
        "old": "medium",
        "new": "high"
      },
      "tags": {
        "old": ["shopping", "personal"],
        "new": ["shopping", "personal", "urgent"]
      }
    },
    "updatedAt": "2026-01-19T11:00:00Z"
  }
}
```

**Consumers**:
- Notification Service (reschedules reminder if dueDate changed)
- Audit Service (logs changes)
- Sync Service (broadcasts to connected clients)

