## Event Flow Diagrams

### Task Creation Flow
```
User → Task Service → Kafka (task-events)
                         ↓
         ┌───────────────┼───────────────┐
         ↓               ↓               ↓
  Notification Svc   Audit Svc      Sync Svc
  (schedule reminder) (log creation) (broadcast)
```

### Task Completion with Recurrence Flow
```
User → Task Service → Kafka (task-events: TaskCompleted)
                         ↓
         ┌───────────────┼───────────────┬───────────────┐
         ↓               ↓               ↓               ↓
  Recurring Svc   Notification Svc   Audit Svc      Sync Svc
  (generate next) (cancel reminder)  (log)          (broadcast)
         ↓
  Kafka (task-events: RecurringTaskGenerated)
         ↓
  Task Service (create new task)
```

### Reminder Delivery Flow
```
Cron (1 min) → Notification Service → Check due reminders
                                           ↓
                                    Send notification
                                           ↓
                                    Kafka (reminders)
                                           ↓
                                    Audit Service (log)
```

