## Event Versioning Strategy

### Backward Compatible Changes (No version bump)
- Adding new optional fields to event data
- Adding new event types

### Breaking Changes (Version bump required)
- Removing fields from event data
- Changing field types
- Renaming fields

**Versioned Event Type Format**: `com.todo.<aggregate>.<action>.v<version>`

**Example**: `com.todo.task.created.v2`

### Migration Strategy
1. Publish both old and new event versions during transition period
2. Update consumers to handle both versions
3. Deprecate old version after all consumers updated
4. Remove old version after deprecation period (30 days)

