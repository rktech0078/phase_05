openapi: 3.0.3
info:
  title: Notification Service API
  description: Reminder notification management API
  version: 1.0.0

servers:
  - url: http://localhost:3002
    description: Local development
  - url: http://notification-service:3002
    description: Kubernetes cluster (internal)

tags:
  - name: Reminders
    description: Reminder management
  - name: Health
    description: Health check endpoints

paths:
  /health:
    get:
      summary: Liveness probe
      tags: [Health]
      responses:
        '200':
          description: Service is alive

  /ready:
    get:
      summary: Readiness probe
      tags: [Health]
      responses:
        '200':
          description: Service is ready

  /api/reminders:
    get:
      summary: List user's reminders
      description: Retrieve all reminders for the authenticated user
      tags: [Reminders]
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, delivered, failed]
      responses:
        '200':
          description: List of reminders
          content:
            application/json:
              schema:
                type: object
                properties:
                  reminders:
                    type: array
                    items:
                      $ref: '#/components/schemas/Reminder'

  /api/reminders/{reminderId}/retry:
    post:
      summary: Retry failed reminder
      description: Manually retry a failed reminder notification
      tags: [Reminders]
      security:
        - bearerAuth: []
      parameters:
        - name: reminderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Reminder retry initiated
        '404':
          description: Reminder not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    Reminder:
      type: object
      properties:
        id:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        userId:
          type: string
        reminderTime:
          type: string
          format: date-time
        deliveryStatus:
          type: string
          enum: [pending, delivered, failed]
        retryCount:
          type: integer
        createdAt:
          type: string
          format: date-time
