openapi: 3.0.3
info:
  title: Recurring Service API
  description: Recurring task management API
  version: 1.0.0

servers:
  - url: http://localhost:3003
    description: Local development
  - url: http://recurring-service:3003
    description: Kubernetes cluster (internal)

tags:
  - name: Recurring Tasks
    description: Recurring task operations
  - name: Health
    description: Health check endpoints

paths:
  /health:
    get:
      summary: Liveness probe
      tags: [Health]
      responses:
        '200':
          description: Service is alive

  /ready:
    get:
      summary: Readiness probe
      tags: [Health]
      responses:
        '200':
          description: Service is ready

  /api/recurring/preview:
    post:
      summary: Preview next recurrence date
      description: Calculate the next due date for a recurrence pattern
      tags: [Recurring Tasks]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - dueDate
                - recurrencePattern
              properties:
                dueDate:
                  type: string
                  format: date-time
                recurrencePattern:
                  type: string
                  enum: [daily, weekly, monthly]
      responses:
        '200':
          description: Next recurrence date
          content:
            application/json:
              schema:
                type: object
                properties:
                  nextDueDate:
                    type: string
                    format: date-time

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
